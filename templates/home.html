{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/home.css' %}">
{% endblock %}

{% block content %}
<div class="home-page">
    <div class="dashboard-container">
        <header class="animate-in">
            <h1 class="brand-title">SafeLog</h1>
            <p class="brand-subtitle">Status: Operativo</p>
        </header>

        <div id="reader-container" style="display:none;" class="animate-in">
            <div id="reader"></div>
            <button onclick="stopScanner()" style="background:transparent; color:#ff5252; border:1px solid #ff5252; padding:12px; border-radius:12px; margin-top:15px; width:100%; cursor:pointer; font-weight:bold; display:flex; align-items:center; justify-content:center; gap:8px;">
                <i class='bx bx-x-circle'></i> ABORTAR ESCANEO
            </button>
        </div>

        <div class="menu-grid" id="main-menu">
            <a href="javascript:void(0)" onclick="startScanner()" class="menu-card animate-in" style="animation-delay: 0.1s;">
                <i class='bx bx-qr-scan'></i>
                <h3>Escanear Zona</h3>
                <span>Activar Cámara</span>
            </a>

            <a href="{% url 'lista_incidentes' %}" class="menu-card animate-in" style="animation-delay: 0.2s;">
                <i class='bx bx-history'></i>
                <h3>Historial</h3>
                <span>Registros del Turno</span>
            </a>
        </div>

        <footer class="animate-in" style="margin-top: 50px; opacity: 0.3; animation-delay: 0.4s;">
            <p style="color: white; font-size: 0.7rem; letter-spacing: 2px;">SECURE TERMINAL V3.0</p>
        </footer>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/scanner.js' %}"></script>
{% endblock %}
